name: Publish Sonics playground
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://pcmac77.github.io/sonics-scouting-report/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/game.test.mjs
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: playground-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
      - name: Wait for artifact visibility
        run: sleep 15
      - uses: actions/deploy-pages@v5
        id: deployment
        continue-on-error: true
        with:
          artifact_name: playground-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - uses: actions/deploy-pages@v5
        if: steps.deployment.outcome == 'failure'
        with:
          artifact_name: playground-${{ github.run_id }}-${{ github.run_attempt }}
